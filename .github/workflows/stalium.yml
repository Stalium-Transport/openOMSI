# Stalium Transport: builds the Windows dedicated server of this fork (openOMSI with the
# Stalium changes) and publishes it as a release.
#   - every push to the branch stalium: builds it and publishes the release
#     stalium-<VERSION>.<run number> (e.g. stalium-0.3.39.4) with the zip
#   - Actions -> Stalium -> Run workflow: the same, by hand
# Independent project based on openOMSI (AGPL-3.0): not an official openOMSI release.
name: Stalium

on:
  workflow_dispatch:
  push:
    branches: [stalium]
    paths-ignore: ["*.md", "docs/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: pwsh
        run: |
          $base = "0.3.39"  # openOMSI release this branch is built on
          $v = "$base.${{ github.run_number }}"
          "OPENOMSI_VERSION=$v-stalium" | Out-File -Append $env:GITHUB_ENV
          "### Stalium (openOMSI) $v" | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: stalium-${{ env.TARGET }}
      - name: Tests (Stalium)
        run: cargo test --locked --release --target ${{ env.TARGET }} -p omsi-lan --lib members
      - name: Build
        run: cargo build --locked --release --target ${{ env.TARGET }} -p omsi-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/server, out | Out-Null
          Copy-Item "target/$env:TARGET/release/openomsi.exe", assets/steam_redist/steam_api64.dll, scripts/server/start.cmd, scripts/server/run-server.cmd, scripts/server/run-server.ps1, LICENSE dist/server/
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          $dir = if ($crt) { $crt.FullName } else { "$env:SystemRoot\System32" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") { Copy-Item (Join-Path $dir $dll) dist/server/ }
          Copy-Item docs/SERVER.md dist/server/README.md
          New-Item -ItemType File -Force dist/server/.openomsi-content | Out-Null
          "# Membres Stalium : un nom par ligne (renommer en membres.txt pour activer)`r`n# Michael`r`nmessage: Serveur reserve aux membres Stalium Transport : inscris-toi sur notre Discord`r`n" | Out-File -Encoding utf8 dist/server/membres.exemple.txt
          Compress-Archive -Path dist/server/* -DestinationPath "out/Stalium-openOMSI-$env:OPENOMSI_VERSION-server-windows-x64.zip"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: stalium-server-windows-x64
          path: out/*.zip

  release:
    needs: server-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stalium-server-windows-x64
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stalium-$(ls out | sed -E 's/.*-([0-9.]+)-stalium-server.*/\1/')"
          gh release create "$tag" out/*.zip -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Stalium $tag" \
            --notes "Serveur dedie Stalium Transport (base openOMSI, projet independant, AGPL-3.0). Protocole 14, compatible avec openOMSI 0.3.37. Code source : commit ${{ github.sha }} de la branche stalium."
