# Stalium Transport: builds the Windows game and dedicated server of this fork (openOMSI
# with the Stalium changes) and publishes them as a release.
#   - Actions -> Stalium -> Run workflow (by hand only): builds them and publishes the
#     release stalium-<VERSION>.<run number> (e.g. stalium-0.3.39.4) with the zips
# Independent project based on openOMSI (AGPL-3.0): not an official openOMSI release.
name: Stalium

on:
  # by hand only: Actions -> Stalium -> Run workflow (a push publishes nothing)
  workflow_dispatch:
    inputs:
      changements:
        description: "Ce qui change dans cette version (separer les changements par ;). Vide : le texte de NOTES-VERSION.md"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: pwsh
        run: |
          $base = "0.3.41"  # openOMSI release this branch is built on
          # (numbers, then -stalium: the launcher takes the numbers, the updater leaves a
          # -stalium build alone)
          "OPENOMSI_VERSION=$base-stalium.${{ github.run_number }}" | Out-File -Append $env:GITHUB_ENV
          "STALIUM_TAG=stalium-$base.${{ github.run_number }}" | Out-File -Append $env:GITHUB_ENV
          "### Stalium (openOMSI) $base.${{ github.run_number }}" | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: stalium-${{ env.TARGET }}
          workspaces: |
            . -> target
            launcher/src-tauri -> target
      # the Stalium directory's address (GitHub secret STALIUM_ANNUAIRE, host:port): scrambled
      # into the program at the build, never in the source
      - name: Stalium directory
        shell: pwsh
        env:
          ANNUAIRE: ${{ secrets.STALIUM_ANNUAIRE }}
        run: |
          $a = "$env:ANNUAIRE".Trim()
          if (-not $a) { "::warning::secret STALIUM_ANNUAIRE missing: BCS trips will be driven alone"; exit 0 }
          $k = [Text.Encoding]::ASCII.GetBytes("Stalium-BCS-2026")
          $d = [Text.Encoding]::UTF8.GetBytes($a)
          $hex = -join (0..($d.Length - 1) | ForEach-Object { '{0:x2}' -f ($d[$_] -bxor $k[$_ % $k.Length]) })
          "STALIUM_ANNUAIRE_X=$hex" | Out-File -Append $env:GITHUB_ENV
      - name: Tests (Stalium)
        run: |
          cargo test --locked --release --target ${{ env.TARGET }} -p omsi-lan --lib bcs
          cargo test --locked --release --target ${{ env.TARGET }} -p omsi-app --lib stalium_bcs
          cargo test --locked --release --target ${{ env.TARGET }} -p omsi-platform --lib stalium_versions
      - name: Build (game, launcher)
        shell: cmd
        run: scripts\build-windows.cmd %TARGET%
      - name: DirectX shader compiler
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" -D dxc
          $zip = Get-ChildItem dxc/*.zip | Where-Object { $_.Name -notmatch "linux|pdb" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dxc/x
          Copy-Item "dxc/x/bin/x64/dxcompiler.dll", "dxc/x/bin/x64/dxil.dll" dist/windows/
      - name: ANGLE (DirectX 11)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ANGLE_TAG: angle-8091-36b74e4dd4
          ANGLE_SHA256: 1c0086155a17445110dd97400018ca6e72ea245ef178989b457720ee1fba3af5
        run: |
          gh release download $env:ANGLE_TAG -R openOMSI-org/angle-openomsi --pattern "*-windows-x64.zip" -D angle
          $zip = Get-ChildItem angle/*.zip | Select-Object -First 1
          $have = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $env:ANGLE_SHA256) { throw "ANGLE zip: SHA-256 $have, expected $env:ANGLE_SHA256" }
          Expand-Archive $zip.FullName -DestinationPath angle/x
          $dir = Get-ChildItem angle/x -Directory | Select-Object -First 1
          Copy-Item (Join-Path $dir.FullName "libEGL.dll"), (Join-Path $dir.FullName "libGLESv2.dll"), (Join-Path $dir.FullName "LICENSE-ANGLE.txt") dist/windows/
      - name: Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          $dir = if ($crt) { $crt.FullName } else { "$env:SystemRoot\System32" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") { Copy-Item (Join-Path $dir $dll) dist/windows/ }
      - name: Package
        shell: pwsh
        run: |
          $v = $env:STALIUM_TAG -replace '^stalium-', ''
          New-Item -ItemType Directory -Force out, dist/server | Out-Null
          Copy-Item STALIUM.md, LICENSE dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "out/Stalium-openOMSI-$v-windows-x64.zip"
          Copy-Item dist/windows/openomsi.exe, dist/windows/steam_api64.dll, dist/windows/vcruntime140.dll, dist/windows/vcruntime140_1.dll, dist/windows/msvcp140.dll, scripts/server/start.cmd, scripts/server/run-server.cmd, scripts/server/run-server.ps1, LICENSE dist/server/
          Copy-Item docs/SERVER.md dist/server/README.md
          New-Item -ItemType File -Force dist/server/.openomsi-content | Out-Null
          Compress-Archive -Path dist/server/* -DestinationPath "out/Stalium-openOMSI-$v-server-windows-x64.zip"
          $env:STALIUM_TAG | Out-File -Encoding ascii out/tag.txt
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: stalium-windows-x64
          path: out/*

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stalium-windows-x64
          path: out
      - uses: actions/checkout@v4
        with:
          sparse-checkout: NOTES-VERSION.md
          sparse-checkout-cone-mode: false
          path: src
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGEMENTS: ${{ inputs.changements }}
        run: |
          tag="$(tr -d '\r\n\357\273\277' < out/tag.txt)"
          rm out/tag.txt
          version="${tag#stalium-}"
          {
            echo "## Stalium Transport ${version}"
            echo
            echo "### Ce qui change"
            echo
            if [ -n "$(echo "$CHANGEMENTS" | tr -d ' ;')" ]; then
              echo "$CHANGEMENTS" | tr ';' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' | sed 's/^/- /'
            elif [ -s src/NOTES-VERSION.md ]; then
              grep -v '^<!--' src/NOTES-VERSION.md
            else
              echo "- Corrections et améliorations."
            fi
            echo
            echo "### Installer"
            echo
            echo "- **Joueurs** : \`Stalium-openOMSI-${version}-windows-x64.zip\`, à décompresser ; dans BCS, choisir ce dossier. Une version Stalium déjà installée se met à jour toute seule dans le lanceur."
            echo "- **Serveur** : \`Stalium-openOMSI-${version}-server-windows-x64.zip\` (garder \`server.cfg\` et \`bcs.txt\`)."
            echo
            echo "---"
            echo "openOMSI Stalium Transport : projet indépendant basé sur openOMSI 0.3.41 (AGPL-3.0), protocole réseau 15. Code source : commit ${{ github.sha }} de la branche stalium."
          } > notes.md
          cat notes.md
          gh release create "$tag" out/*.zip -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Stalium Transport ${version}" \
            --notes-file notes.md
